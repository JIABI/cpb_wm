[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nms"
version = "0.1.0"
description = "Noise-Matched Stochasticity research scaffold"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "NMS Authors" }]
dependencies = [
  "torch>=2.2,<2.6",
  "numpy>=1.26,<2.2",
  "scipy>=1.11",
  "pandas>=2.1",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "wandb>=0.16",
  "tqdm",
  "typing-extensions",
]

[project.optional-dependencies]
exp1 = []
exp2 = [
  "gymnasium[mujoco]>=0.29",
  "dm_control>=1.0.20",
  "ale-py>=0.9",
  "scikit-learn>=1.4",
  # shimmy bridges dm_control → gymnasium; install separately if needed:
  # pip install shimmy[dm-control]>=2.0
]
exp3 = [
  "pettingzoo>=1.24",
  "dm-meltingpot @ git+https://github.com/google-deepmind/meltingpot.git",
]
exp4 = [
  "transformers>=4.44",
  "accelerate",
  "vllm>=0.5",
]
dev = [
  "pytest",
  "pytest-cov",
  "ruff",
  "mypy",
  "pre-commit",
  "ipykernel",
  "jupyterlab",
]

[project.scripts]
nms = "nms.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
no_namespace_packages = true

[[tool.mypy.overrides]]
module = ["nms.core.*"]
strict = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
